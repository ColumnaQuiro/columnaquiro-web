name: Sync Google reviews

# Refreshes app/data/reviews.generated.json (rating, review count and the
# quoted 5-star reviews) from the clinic's Google Business Profile and opens a
# PR when it changed. Never publishes on its own — Netlify builds from main,
# and a person merges. Setup is in the README under "Google reviews sync".

on:
  schedule:
    # 06:00 UTC Monday, an hour before the weekly article, so both land in the
    # same review sitting.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and print the result without committing or opening a PR'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-google-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/sync-google-reviews
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      # Until the secrets exist (the API access request takes Google a while)
      # the scheduled run says so and stops green, rather than failing every
      # Monday for a reason nobody can fix in the repo.
      - id: configured
        name: Check the secrets are set
        env:
          HAS_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::GBP_REFRESH_TOKEN is not set — the Google reviews sync is not configured yet. See README, 'Google reviews sync'."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # No npm install: the script only uses Node built-ins. Exit code 3 means
      # Google has not approved the project's API access yet (quota 0): say so
      # and stop green, since nothing in the repo can fix that.
      - if: steps.configured.outputs.ok == 'true'
        id: fetch
        name: Fetch the rating and reviews
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          # Repository variable, not a secret: accounts/<id>/locations/<id>.
          # Optional while the account has a single location.
          GBP_LOCATION: ${{ vars.GBP_LOCATION }}
          # Interim source while the Business Profile access request is
          # pending: rating and count from the Places API, no reviews. The
          # Place ID is found by a text search when the variable is unset.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GBP_PLACE_ID: ${{ vars.GBP_PLACE_ID }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-google-reviews.mjs --dry-run 2> >(tee sync-summary.txt >&2)
          else
            node scripts/sync-google-reviews.mjs 2> >(tee sync-summary.txt >&2)
          fi
          CODE=$?
          set -e
          if [ $CODE -eq 3 ]; then
            echo "::notice::The Business Profile API access request is not approved yet (quota 0), and no Places API key is set for the interim. Nothing to sync until one of those changes."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ $CODE -eq 0 ] || exit $CODE
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: nothing written."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          else
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.fetch.outputs.fetched == 'true'
        id: diff
        name: Did anything change?
        run: |
          if git status --porcelain -- app/data/reviews.generated.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reviews.generated.json is already current — nothing to open."
          fi

      # One long-lived branch, rebuilt from main on every run, so there is
      # always at most one open PR and it always carries the latest data.
      - if: steps.diff.outputs.changed == 'true'
        name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/data/reviews.generated.json
          git commit -m "[Changed][Reviews]: Sync Google rating and reviews ($(date -u +%Y-%m-%d))" \
                     -m "Generated by scripts/sync-google-reviews.mjs from the clinic's Google Business Profile." \
                     -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push --force --set-upstream origin "$BRANCH"

      - if: steps.diff.outputs.changed == 'true'
        name: Open or refresh the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          read -r RATING COUNT KEPT SOURCE < <(node -e '
            const d = require("./app/data/reviews.generated.json");
            console.log(d.rating, d.count, d.reviews.length, d.source || "business-profile")')
          if [ "$SOURCE" = "places" ]; then
            FROM="the Places API (interim)"
          else
            FROM="the Google Business Profile"
          fi
          {
            echo "Refreshed \`app/data/reviews.generated.json\` from ${FROM} in [run ${RUN_URL##*/}](${RUN_URL})."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Rating | ${RATING} |"
            echo "| Reviews on the listing | ${COUNT} |"
            echo "| Reviews quoted on the site | ${KEPT} |"
            echo
            echo '```'
            cat sync-summary.txt
            echo '```'
            echo
            if [ "$SOURCE" = "places" ]; then
              echo "Interim source: the Places API, because the Business Profile API access request is still pending. Only the rating and count change; the quoted reviews stay the hand-written ones until the approval lands."
            else
              echo "Every quoted review is a 5-star review with text, copied verbatim from the listing (first name only, long ones cut at a sentence end and marked with […]). Skim the diff for anything that should not be on the site — a review that names a third person, say — and merge; Netlify deploys from main."
            fi
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > pr-body.md

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file pr-body.md
            echo "Updated PR #$EXISTING."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "[Changed][Reviews]: Sync Google rating and reviews ($(date -u +%Y-%m-%d))" \
              --body-file pr-body.md
          fi
