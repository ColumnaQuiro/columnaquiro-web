backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: "public/assets/images/blog"
public_folder: "/assets/images/blog"

collections:
  - name: "blog_es"
    label: "Blog (Español)"
    folder: "content/blog/es"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields: &blog_fields
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Usado en la URL: /blog/tu-slug." }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Resumen", name: "excerpt", widget: "text", hint: "Se muestra en la lista del blog, 1-2 frases." }
      - { label: "Imagen de portada", name: "cover", widget: "image" }
      - { label: "Autor/a", name: "author", widget: "string", default: "Léa Guido" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "blog_en"
    label: "Blog (English)"
    folder: "content/blog/en"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields: *blog_fields
